<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Normal stroke route</title>
  <desc id="desc">An overview of how a brush tip becomes dabs, how dabs are split into committed and pending canvases, and how they are composed to the display canvas.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .label { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .small { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .tiny { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .card { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; rx: 18; filter: url(#softShadow); }
      .canvas { fill: #ffffff; stroke: #98a2b3; stroke-width: 2; rx: 10; }
      .arrow { stroke: #344054; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .hint { fill: #eef4ff; stroke: #84adff; stroke-width: 2; rx: 12; }
      .committed { fill: #ecfdf3; stroke: #75e0a7; stroke-width: 2; rx: 10; }
      .pending { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 10; }
      .display { fill: #f0f9ff; stroke: #7dd3fc; stroke-width: 2; rx: 10; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="64" y="66">Normal Stroke Route</text>
  <text class="subtitle" x="64" y="98">A tip becomes many dabs, then committed and pending canvases are composed for display.</text>

  <rect class="card" x="58" y="138" width="290" height="220"/>
  <text class="label" x="86" y="178">1. Brush Tip</text>
  <rect class="canvas" x="100" y="212" width="120" height="120"/>
  <circle cx="160" cy="272" r="44" fill="#2e90fa" opacity="0.18"/>
  <circle cx="160" cy="272" r="32" fill="#2e90fa" opacity="0.42"/>
  <circle cx="160" cy="272" r="18" fill="#2e90fa" opacity="0.9"/>
  <text class="small" x="238" y="266">tipCanvas</text>
  <text class="tiny" x="238" y="289">small reusable image</text>

  <path class="arrow" d="M348 248 C388 248 388 248 424 248"/>

  <rect class="card" x="424" y="138" width="370" height="220"/>
  <text class="label" x="452" y="178">2. Dabs on Path</text>
  <path d="M478 288 C536 214 612 352 728 238" stroke="#98a2b3" stroke-width="4" fill="none" stroke-dasharray="8 8"/>
  <g opacity="0.96">
    <circle cx="494" cy="272" r="22" fill="#2e90fa" opacity="0.36"/>
    <circle cx="538" cy="251" r="24" fill="#2e90fa" opacity="0.44"/>
    <circle cx="584" cy="270" r="26" fill="#2e90fa" opacity="0.52"/>
    <circle cx="632" cy="302" r="25" fill="#2e90fa" opacity="0.48"/>
    <circle cx="682" cy="278" r="23" fill="#2e90fa" opacity="0.42"/>
    <circle cx="722" cy="240" r="22" fill="#2e90fa" opacity="0.36"/>
  </g>
  <text class="small" x="452" y="331">Each placement is one dab.</text>

  <path class="arrow" d="M794 248 C836 248 836 248 872 248"/>

  <rect class="card" x="872" y="138" width="350" height="220"/>
  <text class="label" x="900" y="178">3. Split by Stability</text>
  <rect class="committed" x="908" y="210" width="278" height="52"/>
  <text class="small" x="932" y="243">committed dabs</text>
  <rect class="pending" x="908" y="282" width="278" height="52"/>
  <text class="small" x="932" y="315">pending dabs</text>
  <text class="tiny" x="900" y="352">Stable pixels are kept. Unstable pixels are redrawn.</text>

  <path class="arrow" d="M1038 358 L1038 414"/>

  <rect class="card" x="172" y="414" width="936" height="250"/>
  <text class="label" x="204" y="454">4. Layer Canvases and Display</text>

  <rect class="committed" x="212" y="492" width="255" height="106"/>
  <text class="small" x="238" y="526">committedLayer.canvas</text>
  <text class="tiny" x="238" y="551">append stable dabs</text>
  <circle cx="252" cy="574" r="10" fill="#12b76a" opacity="0.55"/>
  <circle cx="278" cy="574" r="10" fill="#12b76a" opacity="0.55"/>
  <circle cx="304" cy="574" r="10" fill="#12b76a" opacity="0.55"/>

  <rect class="pending" x="514" y="492" width="255" height="106"/>
  <text class="small" x="540" y="526">pendingLayer.canvas</text>
  <text class="tiny" x="540" y="551">clear and redraw</text>
  <circle cx="554" cy="574" r="10" fill="#f97316" opacity="0.6"/>
  <circle cx="580" cy="574" r="10" fill="#f97316" opacity="0.6"/>

  <path class="arrow" d="M468 544 L512 544"/>
  <path class="arrow" d="M770 544 L816 544"/>

  <rect class="display" x="818" y="484" width="245" height="122"/>
  <text class="small" x="848" y="520">display canvas</text>
  <text class="tiny" x="848" y="545">compose layers</text>
  <rect x="862" y="562" width="156" height="22" rx="11" fill="#2e90fa" opacity="0.35"/>
  <rect x="944" y="562" width="52" height="22" rx="11" fill="#f97316" opacity="0.45"/>

  <rect class="hint" x="204" y="620" width="860" height="28"/>
  <text class="tiny" x="224" y="639">On stroke end, remaining pending dabs are committed, then pendingLayer is cleared.</text>
</svg>
