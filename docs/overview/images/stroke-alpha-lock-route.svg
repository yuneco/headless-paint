<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Alpha lock route difference</title>
  <desc id="desc">An overview of the extra work layer used to mask pending preview by committed alpha before drawing to the display canvas.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .label { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .small { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .tiny { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .card { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; rx: 18; filter: url(#softShadow); }
      .committed { fill: #ecfdf3; stroke: #75e0a7; stroke-width: 2; rx: 10; }
      .pending { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 10; }
      .work { fill: #fdf2fa; stroke: #f670c7; stroke-width: 2; rx: 10; }
      .display { fill: #f0f9ff; stroke: #7dd3fc; stroke-width: 2; rx: 10; }
      .arrow { stroke: #344054; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .mask { fill: #101828; opacity: 0.12; }
      .pixel { fill: #12b76a; opacity: 0.65; }
      .preview { fill: #f97316; opacity: 0.7; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="64" y="66">Alpha Lock Masks Pending Preview</text>
  <text class="subtitle" x="64" y="98">Pending is drawn simply, then masked with committed alpha during display composition.</text>

  <rect class="card" x="72" y="142" width="1136" height="540"/>

  <rect class="committed" x="116" y="220" width="260" height="150"/>
  <text class="label" x="146" y="258">committedLayer</text>
  <text class="tiny" x="146" y="282">existing alpha</text>
  <rect x="162" y="308" width="168" height="30" rx="15" class="pixel"/>
  <circle cx="190" cy="323" r="24" class="pixel"/>
  <circle cx="256" cy="323" r="24" class="pixel"/>

  <rect class="pending" x="116" y="442" width="260" height="150"/>
  <text class="label" x="146" y="480">pendingLayer</text>
  <text class="tiny" x="146" y="504">plain preview dabs</text>
  <circle cx="178" cy="548" r="20" class="preview"/>
  <circle cx="226" cy="548" r="20" class="preview"/>
  <circle cx="274" cy="548" r="20" class="preview"/>
  <circle cx="322" cy="548" r="20" class="preview"/>

  <path class="arrow" d="M376 295 C436 295 436 366 494 366"/>
  <path class="arrow" d="M376 517 C436 517 436 390 494 390"/>

  <rect class="work" x="496" y="292" width="300" height="186"/>
  <text class="label" x="532" y="330">workLayer</text>
  <text class="tiny" x="532" y="354">commit + masked pending</text>
  <rect x="568" y="388" width="154" height="28" rx="14" class="pixel"/>
  <circle cx="590" cy="402" r="22" class="pixel"/>
  <circle cx="650" cy="402" r="22" class="pixel"/>
  <circle cx="606" cy="402" r="16" class="preview"/>
  <circle cx="650" cy="402" r="16" class="preview"/>
  <circle cx="694" cy="402" r="16" class="preview"/>
  <rect x="526" y="438" width="240" height="24" rx="12" class="mask"/>
  <text class="tiny" x="574" y="455">pending clipped to alpha</text>

  <path class="arrow" d="M796 385 L910 385"/>

  <rect class="display" x="912" y="292" width="250" height="186"/>
  <text class="label" x="954" y="330">display</text>
  <text class="tiny" x="954" y="354">final view</text>
  <rect x="974" y="394" width="126" height="24" rx="12" fill="#2e90fa" opacity="0.3"/>
  <circle cx="996" cy="406" r="16" fill="#f97316" opacity="0.45"/>
  <circle cx="1038" cy="406" r="16" fill="#f97316" opacity="0.45"/>
  <circle cx="1080" cy="406" r="16" fill="#f97316" opacity="0.45"/>

  <rect x="500" y="540" width="604" height="64" rx="14" fill="#eef4ff" stroke="#84adff" stroke-width="2"/>
  <text class="small" x="530" y="572">Key idea: pendingLayer stays simple.</text>
  <text class="tiny" x="530" y="594">The alpha-locked look is produced just before drawing to the display canvas.</text>
</svg>
