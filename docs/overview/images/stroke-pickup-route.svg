<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Pickup route difference</title>
  <desc id="desc">An overview of the extra canvases used when pickup is enabled before the dab reaches committed or pending layer canvases.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .label { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .small { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475467; }
      .tiny { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; }
      .card { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; rx: 18; filter: url(#softShadow); }
      .canvas { fill: #ffffff; stroke: #98a2b3; stroke-width: 2; rx: 10; }
      .pickup { fill: #fef7c3; stroke: #fdb022; stroke-width: 2; rx: 10; }
      .normal { fill: #eef4ff; stroke: #84adff; stroke-width: 2; rx: 10; }
      .target { fill: #ecfdf3; stroke: #75e0a7; stroke-width: 2; rx: 10; }
      .arrow { stroke: #344054; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #98a2b3; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="64" y="66">Pickup Adds a Mixing Step</text>
  <text class="subtitle" x="64" y="98">The display route stays the same. The dab is prepared differently before it reaches the layer canvases.</text>

  <rect class="card" x="74" y="152" width="1132" height="214"/>
  <text class="label" x="106" y="194">Normal dab path</text>
  <rect class="normal" x="112" y="232" width="210" height="82"/>
  <text class="small" x="151" y="266">tipCanvas</text>
  <text class="tiny" x="151" y="290">original tip</text>
  <path class="muted" d="M322 273 L450 273"/>
  <rect class="target" x="452" y="232" width="260" height="82"/>
  <text class="small" x="491" y="266">committed / pending</text>
  <text class="tiny" x="491" y="290">dab is placed here</text>
  <path class="muted" d="M712 273 L840 273"/>
  <rect class="canvas" x="842" y="232" width="220" height="82"/>
  <text class="small" x="893" y="266">display</text>
  <text class="tiny" x="893" y="290">composed view</text>

  <rect class="card" x="74" y="410" width="1132" height="260"/>
  <text class="label" x="106" y="452">Pickup path</text>
  <rect class="pickup" x="112" y="498" width="190" height="92"/>
  <text class="small" x="148" y="532">sourceLayer</text>
  <text class="tiny" x="148" y="556">sample colors</text>
  <path class="arrow" d="M302 544 L394 544"/>

  <rect class="pickup" x="396" y="498" width="190" height="92"/>
  <text class="small" x="433" y="532">colorBuffer</text>
  <text class="tiny" x="433" y="556">brush color</text>

  <rect class="normal" x="396" y="614" width="190" height="40"/>
  <text class="tiny" x="434" y="639">tipCanvas as mask</text>
  <path class="arrow" d="M586 544 L680 544"/>
  <path class="arrow" d="M491 614 L491 592"/>

  <rect class="pickup" x="682" y="498" width="190" height="92"/>
  <text class="small" x="724" y="532">mixedCanvas</text>
  <text class="tiny" x="724" y="556">actual dab</text>
  <path class="arrow" d="M872 544 L964 544"/>

  <rect class="target" x="966" y="498" width="190" height="92"/>
  <text class="small" x="1005" y="532">layer canvas</text>
  <text class="tiny" x="1005" y="556">same destination</text>

  <text class="tiny" x="106" y="642">Pickup changes how a dab is made, not where the final layer composition goes.</text>
</svg>
